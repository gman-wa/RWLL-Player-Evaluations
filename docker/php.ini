; on top of php.ini-production
expose_php = Off
memory_limit = 128M
; a registration is a JSON post with the photo as base64 - normally ~60KB, 16M leaves room for an unshrunk photo
post_max_size = 16M
max_execution_time = 60
date.timezone = America/Los_Angeles
log_errors = On
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
