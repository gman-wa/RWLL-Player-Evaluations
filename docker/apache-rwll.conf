# RWLL evals - included last from /etc/apache2/conf.d (Dockerfile)

ServerName localhost
ServerSignature Off
ServerTokens Prod
TraceEnable Off
AddDefaultCharset UTF-8

# In production the host's Apache proxies here over plain http, with the visitor in X-Forwarded-For
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12

LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /dev/stdout combined
ErrorLog /dev/stderr
LogLevel ${LOGLEVEL}

<Proxy "unix:/run/php/php-fpm.sock|fcgi://localhost">
    ProxySet connectiontimeout=10 timeout=90
</Proxy>

<VirtualHost *:${HTTP_PORT}>
    DocumentRoot /var/www/rwll/public

    <Directory /var/www/rwll/public>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Only local dev writes photos to disk (PHOTO_STORAGE=local); production photos are on S3
    Alias /photos /var/www/rwll/storage/photos
    <Directory /var/www/rwll/storage/photos>
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    RewriteEngine On
    # real files are served as-is, everything else goes to the front controller
    RewriteCond %{REQUEST_URI} !^/photos/
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^ /index.php [L]

    # asset urls carry ?v=<content hash> (asset() in src/http.php)
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    # the service worker and manifest must always be checked for updates
    <LocationMatch "^/(sw\.js|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    AddType application/manifest+json .webmanifest

    AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript application/json application/manifest+json text/csv

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow"
</VirtualHost>
