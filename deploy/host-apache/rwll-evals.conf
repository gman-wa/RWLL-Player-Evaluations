#### RWLL Evals ####
# The host's Apache in front of the RWLL evals container - /etc/httpd/conf.d/rwll-evals.conf on the EC2
#
# Cloudflare (proxied, SSL mode "Full (strict)") -> this vhost on 443 -> the container on 127.0.0.1:8082.
# Certificate: a Let's Encrypt one of its own (certbot certonly -d rwll-evals.cybernode.com).
# The visitor's IP: httpd.conf has RemoteIPHeader CF-Connecting-IP with Cloudflare's ranges trusted
# (conf.d/cloudflare-ips.inc, set up for Football-NG), and mod_proxy passes it on in X-Forwarded-For.
# At cutover, ServerName becomes rwll.garth.org, plus the old vhost's ServerAlias lines for the league domain's CNAME (deploy/README.md).

<VirtualHost *:80>
ServerName rwll-evals.cybernode.com
ServerAdmin webmaster@cybernode.com
DocumentRoot /var/www/html
RewriteEngine On
# everything but Let's Encrypt's http challenge (certbot serves it from DocumentRoot) to https
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteCond %{SERVER_NAME} =rwll-evals.cybernode.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
CustomLog "|/usr/sbin/rotatelogs -l    /var/log/httpd/rwll-evals-log.%Y%m%d.log 86400" combined
ErrorLog  "|/usr/sbin/rotatelogs -l    /var/log/httpd/rwll-evals-error.%Y%m%d.log 86400"
</VirtualHost>

<VirtualHost *:443>
ServerName rwll-evals.cybernode.com
ServerAdmin webmaster@cybernode.com

SSLEngine on
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile    /etc/letsencrypt/live/rwll-evals.cybernode.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/rwll-evals.cybernode.com/privkey.pem

# a registration posts the photo as base64 - allow the app's own 16M limit through
LimitRequestBody 16777216

# everything goes to the container; the container trusts X-Forwarded-For from the docker network
ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https"
ProxyPass        / http://127.0.0.1:8082/ retry=0 timeout=90
ProxyPassReverse / http://127.0.0.1:8082/

CustomLog "|/usr/sbin/rotatelogs -l    /var/log/httpd/rwll-evals-ssl.%Y%m%d.log 86400" "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"
CustomLog "|/usr/sbin/rotatelogs -l    /var/log/httpd/rwll-evals-log.%Y%m%d.log 86400" combined
ErrorLog  "|/usr/sbin/rotatelogs -l    /var/log/httpd/rwll-evals-error.%Y%m%d.log 86400"
</VirtualHost>
#### end RWLL Evals #####
