# Check, build the ARM image, push it to ECR and deploy it to the EC2 through SSM - see deploy/README.md
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION           us-west-2
#   AWS_DEPLOY_ROLE_ARN  the role GitHub assumes through OIDC (rwll-evals-deploy)
#   ECR_REPOSITORY       rwll-evals
#   EC2_INSTANCE_ID      i-...
#   SETTINGS_SECRET_ID   the Secrets Manager secret's ARN (or name) - rwll-evals/prod
#   BUILD_RUNNER         optional - an arm64 runner label (ubuntu-24.04-arm) to build natively instead of under QEMU
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      # no test suite - every PHP file and script has to at least parse
      - name: PHP syntax
        run: find public src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JS syntax
        run: node --check public/assets/app.js && node --check public/sw.js
      - name: Shell syntax
        run: bash -n deploy/deploy.sh && bash -n scripts/local-dev.sh

  deploy:
    needs: check
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # public repo, public run logs - shows the account id as *** (it's in every ECR image name)
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # t4g instances are arm64 - QEMU builds it on an x86 runner (slower the first time, then the layer cache helps)
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: image
        run: echo "ref=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy through SSM
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          SECRET_ID: ${{ vars.SETTINGS_SECRET_ID }}
        run: |
          # compose.yaml and deploy.sh come out of the image being deployed, so they always match it
          jq -n --arg image "$IMAGE" --arg secret "$SECRET_ID" --arg region "$AWS_REGION" '{
            commands: [
              "set -e",
              "mkdir -p /opt/rwll-evals",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($image | split("/")[0])",
              "docker pull --quiet \($image)",
              "c=$(docker create \($image))",
              "docker cp $c:/var/www/rwll/deploy/compose.yaml /opt/rwll-evals/compose.yaml",
              "docker cp $c:/var/www/rwll/deploy/deploy.sh /opt/rwll-evals/deploy.sh",
              "docker rm $c > /dev/null",
              "AWS_REGION=\($region) bash /opt/rwll-evals/deploy.sh \($image) \($secret)"
            ],
            executionTimeout: ["900"]
          }' > ssm-params.json

          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
                 --comment "rwll-evals ${GITHUB_SHA::7}" --parameters file://ssm-params.json \
                 --query Command.CommandId --output text)
          echo "SSM command $id"

          # wait for it - pulls can take a while, so not aws ssm wait (it gives up after 100s)
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardErrorContent --output text >&2
          echo "status: $status"
          [ "$status" = "Success" ]
